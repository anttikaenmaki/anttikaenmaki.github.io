title: "Antti Käenmäki"
author: "Antti Käenmäki"
tagline: "Mathematician"   # appended to the homepage <title> by jekyll-seo-tag
description: "Homepage of Antti Käenmäki, mathematician working on ergodic theory, fractal geometry, and geometric measure theory. Publications, blog, and teaching."
domain: kaenmaki.net       # short site name shown in the footer
url: https://kaenmaki.net  # the base hostname and protocol for your site, e.g. http://example.com
baseurl: ""       # place folder name if the site is served in a subfolder
permalink: /:categories/:title/
lang: "en"
excerpt_separator: "\n\n\n"
date_format: "%B %e, %Y"

# Layout

show_excerpts: false       # show excerpts of the blog posts
show_frame: true           # adds a gray frame to the site
show_sidebar: false        # show a sidebar instead of the usual header
show_description: false    # show the site description in the sidebar
minimal: false              # use a dark header
mathjax: false             # KaTeX loads only on pages with "mathjax: true" in their front matter
future: false              # never publish future-dated posts, regardless of build pipeline
markdown: kramdown
kramdown:
  input: GFM

# Menu

navigation:                # accepts {file, title, url, icon, sidebaricon}
#  - {file: "index.html", icon: home}
  - {file: "publications.md", icon: file}
  - {file: "blog.md", icon: comment}
  - {file: "opetus.md", icon: chalkboard-teacher}

external:                  # shows a footer with social links - for available icons see fontawesome.com/icons
#  - {title: Mail, icon: envelope, url: "mailto:antti.kaenmaki@gmail.com"}
  - {file: "contact.md", icon: envelope}

comments:
#  disqus_shortname: ""    # see https://disqus.com/
#  isso_domain: ""         # see https://posativ.org/isso/

# Analytics (script is only injected in production builds)
umami:
  src: https://cloud.umami.is/script.js
  website_id: cba10648-cab6-40ef-8309-c65f09539def

plugins:
 - jekyll-feed
 - jekyll-seo-tag
 - jekyll-sitemap
 - jekyll-redirect-from

# Files not part of the published site.
# NOTE: a custom exclude REPLACES Jekyll's default list, so the defaults
# (Gemfile, node_modules, vendor, ...) must be repeated here.
exclude:
 - .sass-cache
 - .jekyll-cache
 - gemfiles
 - Gemfile
 - Gemfile.lock
 - node_modules
 - vendor
 - CNAME
 - TODO.md
 - DOCUMENTATION.md
 - README.md
 - UNLICENSE.txt
 - assets/katex/README.md
